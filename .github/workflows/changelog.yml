name: Changelog

# Separate from tests.yml so that adding or removing the skip-changelog
# label re-runs only this check, not the whole test matrix.  A pull request
# touching only tests and contributor docs changes nothing a user sees.
# Such a pull request gets no check run at all, so do not make this check
# required in branch protection: it would wait forever for one.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths-ignore:
      - "tests/**"
      - "CONTRIBUTING.md"

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changelog:
    name: Check for a news fragment
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install towncrier
        run: pip install towncrier==26.9.0

      - name: Check for a news fragment
        run: towncrier check --compare-with origin/${GITHUB_BASE_REF}
